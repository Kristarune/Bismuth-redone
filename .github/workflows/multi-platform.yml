name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    env:
      GEODE_SDK: ${{ github.workspace }}\geode-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone Geode SDK
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/geode-sdk/sdk.git "$env:GITHUB_WORKSPACE\geode-sdk"

      - name: Build the mod
        shell: pwsh
        run: |
          cmake -B build -S .
          cmake --build build
