name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
