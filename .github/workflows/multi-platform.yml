name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        env:
          CMAKE_GENERATOR: Ninja
        with:
          target: windows
          combine: true
